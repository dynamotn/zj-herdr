name: release

# Push a `v*` tag to publish a release: the CLI for each target as
# `zj-herdr-<target>.tar.gz` (the binary at the archive root) and the Zellij
# plugin as `zj_herdr.wasm`, so `releases/latest/download/zj_herdr.wasm`
# always points at the newest plugin.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cli:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: zj-herdr
          target: ${{ matrix.target }}
          archive: zj-herdr-$target
          token: ${{ secrets.GITHUB_TOKEN }}

  plugin:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip1
      - run: cargo build -p zj-herdr-plugin --target wasm32-wasip1 --release
      - run: gh release upload "$GITHUB_REF_NAME" target/wasm32-wasip1/release/zj_herdr.wasm --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
