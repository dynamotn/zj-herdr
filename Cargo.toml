[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/plugin"]

[workspace.package]
version = "0.3.1"
edition = "2021"

[workspace.dependencies]
zj-herdr-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
